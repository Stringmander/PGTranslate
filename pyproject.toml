[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "vgtranslate3"
version         = "0.1.0"
description     = "Lightweight OCR + MT server for game screen captures"
readme          = "README.md"
license         = { text = "GPL-3.0-or-later" }
authors         = [{ name = "Denis Markovich", email = "namevle@gmail.com" }]
requires-python = ">=3.14"

# — базовые рантайм-зависимости —
dependencies = [
    "pillow>=12,<13",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
# Local OCR with Tesseract
local-ocr = [
    "pytesseract>=0.3,<0.4",
    "opencv-python-headless>=4.14,<6",
    "numpy>=2.4,<3",
]

# Web UI (optional)
webui = [
    "websockets>=15,<18",
]

# Full installation (all features)
full = [
    "vgtranslate3[local-ocr,webui]",
]

# Development dependencies
dev = [
    "pytest>=8.3",
    "black>=25",
    "flake8>=7",
    "mypy>=2.0",
    "ruff>=0.4",
]

[project.scripts]
vgtranslate3 = "vgtranslate3.serve:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vgtranslate3" = [
    "config.json",
    "fonts/**/*"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
files = ["src/vgtranslate3", "tests"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "pytesseract.*",
    "pyocr.*",
    "websockets.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (modern syntax)
    "FA",  # future-annotations (prefer native syntax on 3.14+)
]
ignore = [
    "E501",  # line length — handled by black
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
